name: NEPAL TARGET DATE

on:
  schedule:
    - cron: '*/40 * * * *'   # runs every 40 minutes
  workflow_dispatch:          # also allow manual trigger
    

# 🔥 prevent overlapping runs
concurrency:
  group: nepal-target-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240      # 4-hour job cap

    strategy:
      fail-fast: false
      matrix:
        date: ["20260826"]

    env:
      REPO: thecineoverseas/nepal
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      # 🔒 Clone PRIVATE repo
      - name: Clone Private Repo
        run: |
          git clone --depth=1 https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git

      # 🐍 Setup Python
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 📦 Install dependencies
      - name: Install dependencies
        run: |
          cd nepal
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install requests

      # 🎬 Run scraper
      - name: Run scraper
        run: |
          cd nepal
          RUN_DATE="${{ matrix.date }}"
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            RUN_DATE="${{ github.event.inputs.target_date }}"
          fi
          MODE="advance"

          echo "🎬 Running nepal.py with mode $MODE and date $RUN_DATE"

          for i in {1..6}; do
            echo "Attempt $i"

            if python nepal.py --mode "$MODE" --date "$RUN_DATE"; then
              echo "✅ Scraper finished successfully"
              break
            fi

            echo "❌ Scraper failed. Retrying in 10 seconds..."
            sleep 10
          done

      # 💾 Commit & Push
      - name: Commit scraper data
        run: |
          cd nepal
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Remove __pycache__ folders and untrack them if previously tracked in repo
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true
          git rm -rf --cached __pycache__ 2>/dev/null || true

          git add data/ || true

          RUN_DATE="${{ matrix.date }}"
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            RUN_DATE="${{ github.event.inputs.target_date }}"
          fi

          git commit -m "target=$RUN_DATE advance ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))" || echo "No changes"

          sleep $((RANDOM % 10))

          for i in {1..5}; do
            echo "Push attempt $i"

            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash origin main || true
            find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
            git rm -rf --cached __pycache__ 2>/dev/null || true

            if git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git; then
              echo "✅ Push succeeded"
              break
            fi

            echo "❌ Push failed. Retrying in 5 seconds..."
            sleep 5
          done
