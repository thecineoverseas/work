name: SINGAPORE TARGET DATE

on:
  schedule:
    - cron: '*/40 * * * *'   # runs every 40 minutes
  workflow_dispatch:          # allow manual trigger
    inputs:
      target_date:
        description: 'Primary Target Date (YYYYMMDD)'
        required: false
        default: '20260814'

# 🔥 prevent overlapping runs
concurrency:
  group: singapore-target-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape-target-dates:
    runs-on: ubuntu-latest
    timeout-minutes: 240      # 4-hour job cap

    strategy:
      fail-fast: false
      matrix:
        date: ["20260826"]

    env:
      REPO: thecineoverseas/singapore
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      # 🔒 Clone PRIVATE repo
      - name: Clone Private Repo
        run: |
          git clone --depth=1 https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git

      # 🐍 Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 📦 Install dependencies
      - name: Install dependencies
        run: |
          cd singapore
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests playwright
          fi

      # 💾 Cache Playwright browsers
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('singapore/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # 📥 Install Playwright Chromium
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      # 📥 Install Playwright System Dependencies
      - name: Install Playwright System Dependencies
        run: python -m playwright install-deps

      # 🎬 Run Scraper for Target Date
      - name: Run Singapore Scraper for Target Date
        run: |
          cd singapore
          RUN_DATE="${{ matrix.date }}"
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            RUN_DATE="${{ github.event.inputs.target_date }}"
          fi
          MODE="advance"

          echo "🎬 Singapore Scraper — mode=$MODE date=$RUN_DATE"

          for i in {1..6}; do
            echo "Attempt $i"

            if python singapore.py --mode "$MODE" --date "$RUN_DATE"; then
              echo "✅ Scraper finished successfully"
              break
            fi

            echo "❌ Scraper failed. Retrying in 10 seconds..."
            sleep 10
          done

      # 💾 Commit & Push
      - name: Commit scraper data
        run: |
          cd singapore
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          git rm -rf --cached __pycache__ 2>/dev/null || true

          git add data/ || true

          git commit -m "target=${{ matrix.date }} advance ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))" || echo "No changes"

          sleep $((RANDOM % 10))

          for i in {1..5}; do
            echo "Push attempt $i"
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash origin main || true
            find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
            git rm -rf --cached __pycache__ 2>/dev/null || true

            if git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git; then
              echo "✅ Push succeeded"
              break
            fi
            echo "❌ Push failed. Retrying in 5s..."
            sleep 5
          done
