name: DENMARK TARGET DATE

on:
  schedule:
    - cron: '*/40 * * * *'   # runs every 40 minutes
  workflow_dispatch:          # allow manual trigger

# Prevent overlapping runs
concurrency:
  group: denmark-target-${{ github.ref }}-${{ github.event.inputs.target_date || 'default' }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    strategy:
      fail-fast: false
      matrix:
        date: ["20261014"]

    env:
      REPO: thecineoverseas/denamark
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      # 1. Clone Private Repo
      - name: Clone Private Repo
        run: |
          if git clone --depth=1 https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git repo_dir; then
            echo "✅ Successfully cloned from ${{ env.REPO }}"
          elif git clone --depth=1 https://x-access-token:${{ secrets.GH_PAT }}@github.com/thecineoverseas/denmark.git repo_dir; then
            echo "✅ Successfully cloned from thecineoverseas/denmark"
          else
            echo "❌ Failed to clone repository"
            exit 1
          fi

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install Dependencies
      - name: Install dependencies
        run: |
          cd repo_dir
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt || true
          fi
          pip install requests curl_cffi beautifulsoup4 tabulate python-dateutil pytz cloudscraper aiohttp aiohttp_retry tqdm urllib3 Pillow numpy scipy

      # 4. Run Scraper
      - name: Run scraper
        run: |
          cd repo_dir
          RUN_DATE="${{ github.event.inputs.target_date || matrix.date }}"
          MODE="advance"

          SCRIPTPATH="denmark.py"
          if [ ! -f "$SCRIPTPATH" ]; then
            if [ -f "denmark/denmark.py" ]; then
              SCRIPTPATH="denmark/denmark.py"
            elif [ -f "denamark/denmark.py" ]; then
              SCRIPTPATH="denamark/denmark.py"
            elif [ -f "ayngaran.py" ]; then
              SCRIPTPATH="ayngaran.py"
            fi
          fi

          echo "🎬 Running $SCRIPTPATH with mode $MODE and date $RUN_DATE"

          for i in {1..6}; do
            echo "Attempt $i"
            if python "$SCRIPTPATH" --mode "$MODE" --date "$RUN_DATE" --days 4; then
              echo "✅ Scraper finished successfully"
              break
            fi
            echo "❌ Scraper failed. Retrying in 10 seconds..."
            sleep 10
          done

      # 5. Commit and push data
      - name: Commit and push data
        run: |
          cd repo_dir
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Remove bytecode caches
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          git rm -rf --cached __pycache__ 2>/dev/null || true

          git add data/ || git add . || true
          git commit -m "denmark target date update (${{ matrix.date }}) ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))" || echo "No changes"

          sleep $((RANDOM % 10))

          for i in {1..5}; do
            echo "Push attempt $i"
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash origin main || true
            find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
            git rm -rf --cached __pycache__ 2>/dev/null || true

            if git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git; then
              echo "✅ Push succeeded to ${{ env.REPO }}"
              break
            fi
            echo "❌ Push failed. Retrying in 5 seconds..."
            sleep 5
          done
