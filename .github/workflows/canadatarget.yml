name: CANADA TARGET

on:
  workflow_dispatch:

# 🔥 prevent overlapping runs
concurrency:
  group: canada-t-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest

    env:
      REPO: thecineoverseas/canada
      TARGET_DATE: 20260813

    steps:
      # 🔒 Clone PRIVATE repo
      - name: Clone Private Repo
        run: |
          git clone --depth=1 https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git

      # 🐍 Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 📦 Install dependencies
      - name: Install dependencies
        run: |
          cd canada
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests curl_cffi beautifulsoup4 tabulate aiohttp cloudscraper playwright
          fi
          playwright install chromium

      # 🎬 Run scraper
      - name: Run scraper
        run: |
          cd canada
          echo "🎬 Running canada.py with target date ${{ env.TARGET_DATE }}"

          for i in {1..6}; do
            echo "Attempt $i"

            if python canada.py --date "${{ env.TARGET_DATE }}"; then
              echo "✅ Scraper finished successfully"
              break
            fi

            echo "❌ Scraper failed. Retrying in 10 seconds..."
            sleep 10
          done

      # 💾 Commit & Push
      - name: Commit scraper data
        run: |
          cd canada
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit -m "update for ${{ env.TARGET_DATE }} ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))" || echo "No changes"

          sleep $((RANDOM % 10))

          for i in {1..5}; do
            echo "Push attempt $i"

            git pull --rebase origin main || true

            if git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git; then
              echo "✅ Push succeeded"
              break
            fi

            echo "❌ Push failed. Retrying in 5 seconds..."
            sleep 5
          done
