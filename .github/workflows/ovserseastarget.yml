name: OVERSEAS TARGET DATE (Qatar, Nepal, Malaysia, Singapore, Aus, NZ)

on:
  schedule:
    - cron: '*/40 * * * *'   # Runs every 40 minutes
  workflow_dispatch:          # Allows manual trigger with custom target date


# Prevent overlapping runs (scoped per target country)
concurrency:
  group: overseas-target-${{ github.ref }}-${{ matrix.target.name }}-${{ github.event.inputs.target_date || 'default' }}
  cancel-in-progress: true

jobs:
  scrape-target-date:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - name: Qatar
            repo: thecineoverseas/qatar
            script: qatar.py
            folder: qatar
            fallback_name: qatar
          - name: Nepal
            repo: thecineoverseas/nepal
            script: nepal.py
            folder: nepal
            fallback_name: nepal
          - name: Malaysia
            repo: thecineoverseas/malaysia
            script: malaysia.py
            folder: malaysia
            fallback_name: malaysia
          - name: Singapore
            repo: thecineoverseas/singapore
            script: singapore.py
            folder: singapore
            fallback_name: singapore
          - name: Australia
            repo: thecineoverseas/aus
            script: aus.py
            folder: aus
            fallback_name: aus
          - name: New Zealand
            repo: thecineoverseas/aus
            script: nz.py
            folder: aus
            fallback_name: aus
        date: ["20260924"]

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      # 1. Clone Private Target Repository directly into repo_dir with fallback
      - name: Clone Private Repo
        run: |
          CLONED_REPO="${{ matrix.target.repo }}"
          if git clone --depth=1 https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ matrix.target.repo }}.git repo_dir; then
            echo "✅ Successfully cloned from ${{ matrix.target.repo }}"
          elif git clone --depth=1 https://x-access-token:${{ secrets.GH_PAT }}@github.com/cinenationbo/${{ matrix.target.fallback_name }}.git repo_dir; then
            CLONED_REPO="cinenationbo/${{ matrix.target.fallback_name }}"
            echo "✅ Successfully cloned from fallback: $CLONED_REPO"
          elif git clone --depth=1 https://x-access-token:${{ secrets.GH_PAT }}@github.com/thecineoverseas/${{ matrix.target.fallback_name }}.git repo_dir; then
            CLONED_REPO="thecineoverseas/${{ matrix.target.fallback_name }}"
            echo "✅ Successfully cloned from fallback: $CLONED_REPO"
          else
            echo "❌ Failed to clone repository"
            exit 1
          fi
          echo "CLONED_REPO=$CLONED_REPO" >> $GITHUB_ENV

      # 2. Start FlareSolverr Service
      - name: Start FlareSolverr Service
        run: |
          docker run -d \
            --name=flaresolverr \
            -p 8191:8191 \
            -e LOG_LEVEL=info \
            --restart unless-stopped \
            ghcr.io/flaresolverr/flaresolverr:latest
          echo "Waiting for FlareSolverr to initialize..."
          sleep 10

      # 3. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 4. Install Dependencies
      - name: Install Dependencies
        run: |
          cd repo_dir
          if [ -d "${{ matrix.target.folder }}" ] && [ ! -f "${{ matrix.target.script }}" ]; then
            cd "${{ matrix.target.folder }}"
          elif [ -d "Qatar" ] && [ ! -f "${{ matrix.target.script }}" ]; then
            cd Qatar
          fi
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests curl_cffi beautifulsoup4 tabulate playwright pycryptodome cryptography python-dateutil pytz cloudscraper aiohttp aiohttp_retry tqdm
          fi
          pip install playwright xvfbwrapper || true

      # 5. Install Playwright Chromium with dependencies
      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps || true

      # 6. Run Scraper for Target Date
      - name: Run Target Date Scraper
        run: |
          cd repo_dir
          if [ -d "${{ matrix.target.folder }}" ] && [ ! -f "${{ matrix.target.script }}" ]; then
            cd "${{ matrix.target.folder }}"
          elif [ -d "Qatar" ] && [ ! -f "${{ matrix.target.script }}" ]; then
            cd Qatar
          fi

          SCRIPTPATH="${{ matrix.target.script }}"
          if [ ! -f "$SCRIPTPATH" ]; then
            if [ "$SCRIPTPATH" = "aus.py" ] && [ -f "austrila.py" ]; then
              SCRIPTPATH="austrila.py"
            fi
          fi

          RUN_DATE="${{ github.event.inputs.target_date || matrix.date }}"
          echo "🎬 Running ${{ matrix.target.name }} [Target Date: $RUN_DATE]: python $SCRIPTPATH --mode advance --date $RUN_DATE"

          SUCCESS=false
          for i in {1..6}; do
            echo "▶️ Attempt $i..."
            if xvfb-run -a python "$SCRIPTPATH" --mode advance --date "$RUN_DATE" || xvfb-run -a python "$SCRIPTPATH" --date "$RUN_DATE"; then
              echo "✅ ${{ matrix.target.name }} scraper finished successfully"
              SUCCESS=true
              break
            fi
            echo "❌ Attempt $i failed. Retrying in 10 seconds..."
            sleep 10
          done

      # 7. Commit & Push Scraper Data directly back to target repo
      - name: Commit & Push Data
        run: |
          cd repo_dir
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Remove bytecode caches
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          git rm -rf --cached __pycache__ 2>/dev/null || true

          git add data/ || git add . || true

          RUN_DATE="${{ github.event.inputs.target_date || matrix.date }}"
          git commit -m "target date $RUN_DATE update ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))" || echo "No changes"

          sleep $((RANDOM % 10))

          for i in {1..5}; do
            echo "Push attempt $i"
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash origin main || true
            find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
            git rm -rf --cached __pycache__ 2>/dev/null || true

            if git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.CLONED_REPO }}.git; then
              echo "✅ Push succeeded to ${{ env.CLONED_REPO }}"
              break
            fi
            echo "❌ Push failed. Retrying in 5 seconds..."
            sleep 5
          done
