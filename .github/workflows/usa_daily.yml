name: USA Daily Box Office Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

concurrency:
  group: usa-daily-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest

    env:
      REPO: thecineoverseas/usa

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone Private Repo
        run: |
          git clone --depth=1 https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('usa/requirements.txt') }}

      - name: Install dependencies
        run: |
          cd usa
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests aiohttp aiohttp-retry tqdm
          fi

      - name: Run USA Daily Scraper
        run: |
          cd usa
          if [ -f daily.py ]; then
            python daily.py
          elif [ -f usa-Main/daily.py ]; then
            python usa-Main/daily.py
          elif [ -f usa/usa-Main/daily.py ]; then
            python usa/usa-Main/daily.py
          else
            python live.py
          fi

      - name: Commit & Push Output
        run: |
          cd usa
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "update USA daily box office telemetry ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"

            for i in {1..5}; do
              echo "🔁 Push attempt $i..."
              git pull --rebase origin main && \
              git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git && break
              echo "⚠️ Push failed. Retrying in $((i*5))s..."
              sleep $((i*5))
            done

            echo "✅ Daily updates pushed successfully"
          else
            echo "🟡 No changes detected"
          fi
