name: USA Daily Box Office Scraper (Go)

on:
  workflow_dispatch:

concurrency:
  group: usa-daily-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      REPO: thecineoverseas/usa

    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Clone Private Repo
        run: |
          git clone --depth=1 https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git

      - name: Cache Go Modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('usa/go.sum', 'usa/usa-go/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build Go Binary
        run: |
          if [ -f usa/go.mod ]; then
            cd usa
          elif [ -f usa/usa-go/go.mod ]; then
            cd usa/usa-go
          else
            echo "❌ go.mod not found in usa/ or usa/usa-go/"
            exit 1
          fi
          go build -o /tmp/usa-go .

      - name: Run USA Daily Scraper
        run: |
          cd usa
          /tmp/usa-go --mode daily --date today --out-dir data/daily

      - name: Commit & Push Output
        run: |
          cd usa
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/daily/
          if ! git diff --cached --quiet; then
            git commit -m "update USA daily box office telemetry ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"

            for i in {1..5}; do
              echo "🔁 Push attempt $i..."
              if git pull --rebase --autostash origin main && git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git; then
                echo "✅ Daily updates pushed successfully"
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
          else
            echo "🟡 No changes detected"
          fi
